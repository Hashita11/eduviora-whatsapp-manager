<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDUVIORA WhatsApp Marketing Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div>
        <h1>EDUVIORA</h1>
        <p>WhatsApp Marketing Manager</p>
    </div>
</header>

<div class="container">

    <!-- DASHBOARD -->
    <section id="dashboard">

        <h2>Dashboard</h2>

        <div class="cards">

            <div class="card">
                <span>Total Contacts</span>
                <strong id="totalContacts">0</strong>
            </div>

            <div class="card">
                <span>Message Templates</span>
                <strong id="totalTemplates">0</strong>
            </div>

            <div class="card">
                <span>Prepared Messages</span>
                <strong id="totalMessages">0</strong>
            </div>

        </div>

    </section>


    <!-- NAVIGATION -->

    <div class="menu">

        <button onclick="showSection('contacts')">
            👥 Contacts
        </button>

        <button onclick="showSection('templates')">
            📝 Templates
        </button>

        <button onclick="showSection('campaigns')">
            📢 Campaigns
        </button>

    </div>


    <!-- CONTACTS -->

    <section id="contacts" class="section">

        <h2>Customer Contacts</h2>

        <div class="form">

            <input
                type="text"
                id="contactName"
                placeholder="Customer Name"
            >

            <input
                type="tel"
                id="contactPhone"
                placeholder="Mobile Number"
            >

            <input
                type="text"
                id="contactCategory"
                placeholder="Category"
            >

            <button onclick="addContact()">
                + Add Contact
            </button>

        </div>

        <br>

        <input
            type="text"
            id="searchContact"
            placeholder="Search customer..."
            onkeyup="displayContacts()"
            class="search"
        >

        <div id="contactList"></div>

    </section>


    <!-- TEMPLATES -->

    <section id="templates" class="section">

        <h2>Message Templates</h2>

        <input
            type="text"
            id="templateTitle"
            placeholder="Template Name"
        >

        <textarea
            id="templateMessage"
            placeholder="Type your message here..."
        ></textarea>

        <button onclick="addTemplate()">
            + Save Template
        </button>

        <div id="templateList"></div>

    </section>


    <!-- CAMPAIGNS -->

    <section id="campaigns" class="section">

        <h2>WhatsApp Campaign</h2>

        <p>
            Select a customer and prepare a WhatsApp message.
        </p>

        <div id="campaignList"></div>

    </section>

</div>


<footer>
    <strong>EDUVIORA</strong>
    <br>
    One Platform. Every Business.
    <br>
    www.eduviora.in
</footer>


<script src="app.js"></script>

</body>
</html>
